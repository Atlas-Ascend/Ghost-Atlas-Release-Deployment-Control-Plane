version: "1.0.0"
id: nine-site-office-fabric
source_repository: Atlas-Ascend/nextjs-boilerplate
source_branch: office-fabric-nine-site-estate
release_scope: site-scoped
receipt_schema: schemas/site-release-receipt.schema.json
sites:
  - site_id: SITE-EMPIRE
    office_id: OFFICE-EMPIRE-VISION
    domain: ghostatlasempire.com
  - site_id: SITE-ESTATE
    office_id: OFFICE-ESTATE-PUBLIC-IO
    domain: ghostatlasestate.com
  - site_id: SITE-ATLAS-MIND
    office_id: OFFICE-ATLAS-MIND-PRODUCT
    domain: atlasmind.global
  - site_id: SITE-ALTERED-STATE
    office_id: OFFICE-ALTERED-STATE-OBSERVATORY
    domain: alteredstate.cloud
  - site_id: SITE-INSTITUTE
    office_id: OFFICE-INSTITUTE-RESEARCH
    domain: ghostatlasinstitute.org
  - site_id: SITE-CONSULTING
    office_id: OFFICE-CONSULTING-COMMERCIAL
    domain: ghostatlasconsulting.com
  - site_id: SITE-AUTOMATED-SYSTEMS
    office_id: OFFICE-AUTOMATED-SYSTEMS-DEPLOYMENT
    domain: atlasautomatedsystems.com
  - site_id: SITE-GLOBAL-ASCENSION
    office_id: OFFICE-GLOBAL-ASCENSION-PUBLIC-BENEFIT
    domain: globalascension.online
  - site_id: SITE-GHOST-ATLAS-OS
    office_id: OFFICE-GHOST-ATLAS-OS-DISTRIBUTION
    domain: ghostatlasos.shop
required_gates:
  repository:
    - build
    - typecheck
    - route-generation
  preview:
    - http
    - correct-site-identity
    - no-cross-site-identity-bleed
    - telemetry-context
  production:
    - dns
    - tls
    - host-routing
    - security-boundary
    - proofgrid-receipt
promotion_policy:
  independent_site_promotion: true
  all_nine_required_for_estate_release: true
  partial_site_failure_blocks_estate_release: true
  rollback_scope: site-or-shared-runtime
  external_publish_default: disabled
  repository_proof_is_runtime_proof: false
events:
  request: office.release.requested
  promoted: office.release.promoted
  failure: office.runtime.degraded
proof:
  authority: ProofGrid
  verifier: SECA/DevOS
  security: Medusa
  memory: Thoth
